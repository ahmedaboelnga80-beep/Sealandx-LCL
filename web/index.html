<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="sealandx_lcl">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>sealandx_lcl</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    window._sealandxStorage = {
      db: null,
      init: function() {
        return new Promise(function(resolve) {
          try {
            var keysToRemove = [];
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              // Clean only individual base64 images, NEVER delete the list of images (web_imgs_)!
              if (k && k.indexOf('web_img_') === 0 && k.indexOf('web_imgs_') !== 0) {
                var val = localStorage.getItem(k);
                if (val && val.length > 500) {
                  keysToRemove.push(k);
                }
              }
            }
            for (var j = 0; j < keysToRemove.length; j++) {
              localStorage.removeItem(keysToRemove[j]);
            }
            if (keysToRemove.length > 0) {
              console.log('[SealandX] Cleared ' + keysToRemove.length + ' bloated base64 keys from localStorage.');
            }

            var req = indexedDB.open('sealandx_images_db', 1);
            req.onupgradeneeded = function(e) {
              var db = e.target.result;
              if (!db.objectStoreNames.contains('images')) {
                db.createObjectStore('images');
              }
            };
            req.onsuccess = function(e) {
              window._sealandxStorage.db = e.target.result;
              resolve(true);
            };
            req.onerror = function(e) {
              console.warn('[SealandX] IndexedDB open error:', e);
              resolve(false);
            };
          } catch (err) {
            console.warn('[SealandX] Init error:', err);
            resolve(false);
          }
        });
      },
      saveImage: function(key, base64) {
        return new Promise(function(resolve) {
          try {
            var db = window._sealandxStorage.db;
            if (!db) { resolve(false); return; }
            var tx = db.transaction(['images'], 'readwrite');
            var store = tx.objectStore('images');
            var req = store.put(base64, key);
            req.onsuccess = function() { resolve(true); };
            req.onerror = function() { resolve(false); };
          } catch (e) {
            resolve(false);
          }
        });
      },
      getImage: function(key) {
        return new Promise(function(resolve) {
          try {
            var db = window._sealandxStorage.db;
            if (!db) { resolve(null); return; }
            var tx = db.transaction(['images'], 'readonly');
            var store = tx.objectStore('images');
            var req = store.get(key);
            req.onsuccess = function(e) {
              resolve(e.target.result || null);
            };
            req.onerror = function() { resolve(null); };
          } catch (e) {
            resolve(null);
          }
        });
      },
      deleteImage: function(key) {
        return new Promise(function(resolve) {
          try {
            var db = window._sealandxStorage.db;
            if (!db) { resolve(false); return; }
            var tx = db.transaction(['images'], 'readwrite');
            var store = tx.objectStore('images');
            var req = store.delete(key);
            req.onsuccess = function() { resolve(true); };
            req.onerror = function() { resolve(false); };
          } catch (e) {
            resolve(false);
          }
        });
      },
      deleteImagesForFolder: function(prefix) {
        return new Promise(function(resolve) {
          try {
            var db = window._sealandxStorage.db;
            if (!db) { resolve(false); return; }
            var tx = db.transaction(['images'], 'readwrite');
            var store = tx.objectStore('images');
            var req = store.openCursor();
            req.onsuccess = function(e) {
              var cursor = e.target.result;
              if (cursor) {
                if (typeof cursor.key === 'string' && cursor.key.indexOf(prefix) !== -1) {
                  cursor.delete();
                }
                cursor.continue();
              } else {
                resolve(true);
              }
            };
            req.onerror = function() { resolve(false); };
          } catch (e) {
            resolve(false);
          }
        });
      },
      compressImage: function(base64, maxDimension, quality) {
          var timer = setTimeout(function() {
            resolve(base64);
          }, 1500);

          try {
            var img = new Image();
            img.onload = function() {
              clearTimeout(timer);
              var width = img.naturalWidth || img.width;
              var height = img.naturalHeight || img.height;
              if (!width || !height) {
                resolve(base64);
                return;
              }
              if (width <= maxDimension && height <= maxDimension && base64.length < 300000) {
                resolve(base64);
                return;
              }
              if (width > maxDimension || height > maxDimension) {
                if (width > height) {
                  height = Math.round((height * maxDimension) / width);
                  width = maxDimension;
                } else {
                  width = Math.round((width * maxDimension) / height);
                  height = maxDimension;
                }
              }
              var canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              var ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              var result = canvas.toDataUrl('image/jpeg', quality || 0.75);
              var comma = result.indexOf(',');
              resolve(comma !== -1 ? result.substring(comma + 1) : result);
            };
            img.onerror = function() {
              clearTimeout(timer);
              resolve(base64);
            };
            var mime = 'image/jpeg';
            if (base64.indexOf('iVBORw0K') === 0) mime = 'image/png';
            else if (base64.indexOf('UklGR') === 0) mime = 'image/webp';
            img.src = 'data:' + mime + ';base64,' + base64;
          } catch (e) {
            clearTimeout(timer);
            resolve(base64);
          }
        });
      }
    };
    window._sealandxStorage.init();

    // Clear stale service worker caches to ensure immediate updates
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var r of regs) { r.unregister(); }
      });
    }
  </script>
  <script src="flutter_bootstrap.js?v=2" async></script>
</body>
</html>
